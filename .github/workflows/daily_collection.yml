name: CinePulse India Daily Box-Office Collection

on:
  schedule:
    # 03:00 UTC = 08:30 Asia/Kolkata (IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reporting_date:
        description: 'Optional reporting date (YYYY-MM-DD, defaults to today UTC)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect-and-generate-drafts:
    name: Collect Authorized Reports & Generate Drafts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run daily collection and draft generation pipeline (no X publishing)
        working-directory: backend
        env:
          APP_ENV: production
          DISPLAY_TIMEZONE: Asia/Kolkata
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          LICENSED_FEED_API_KEY: ${{ secrets.LICENSED_FEED_API_KEY }}
          LICENSED_FEED_BASE_URL: ${{ secrets.LICENSED_FEED_BASE_URL }}
          PERMITTED_RSS_URLS: ${{ secrets.PERMITTED_RSS_URLS }}
        run: |
          TRIGGER="SCHEDULED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="MANUAL"
          fi
          if [ -n "${{ github.event.inputs.reporting_date }}" ]; then
            python -m app.main --trigger "$TRIGGER" --date "${{ github.event.inputs.reporting_date }}"
          else
            python -m app.main --trigger "$TRIGGER"
          fi
