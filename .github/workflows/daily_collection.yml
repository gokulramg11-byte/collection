name: CinePulse India Daily Box-Office Collection

on:
  schedule:
    # 03:00 UTC = 08:30 Asia/Kolkata (IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reporting_date:
        description: 'Optional reporting date (YYYY-MM-DD, defaults to today UTC)'
        required: false
        default: ''
      reset_data:
        description: 'Clear old database & JSON before collecting fresh data'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  collect-and-generate-drafts:
    name: Collect Authorized Reports & Export Sanitized JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main branch (code)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout or initialize data branch (JSON & SQLite state)
        shell: bash
        run: |
          mkdir -p public_data
          git clone --branch data --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" public_data || (
            cd public_data && git init -b data && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          )
          if [ "${{ github.event.inputs.reset_data }}" = "true" ]; then
            echo "Resetting old database and JSON snapshots..."
            rm -f public_data/cinepulse.db public_data/*.json
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: repo/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: repo/backend
        run: pip install -r requirements.txt

      - name: Run daily collection, draft generation & sanitized JSON export (no X publishing)
        working-directory: repo/backend
        env:
          APP_ENV: production
          DISPLAY_TIMEZONE: Asia/Kolkata
          # Falls back to local SQLite in public_data/cinepulse.db when no external DB secret is set
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || format('sqlite+pysqlite:///{0}/public_data/cinepulse.db', github.workspace) }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          LICENSED_FEED_API_KEY: ${{ secrets.LICENSED_FEED_API_KEY }}
          LICENSED_FEED_BASE_URL: ${{ secrets.LICENSED_FEED_BASE_URL }}
          PERMITTED_RSS_URLS: ${{ secrets.PERMITTED_RSS_URLS }}
        run: |
          TRIGGER="SCHEDULED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="MANUAL"
          fi
          EXPORT_PATH="${{ github.workspace }}/public_data"
          if [ -n "${{ github.event.inputs.reporting_date }}" ]; then
            python -m app.main --trigger "$TRIGGER" --date "${{ github.event.inputs.reporting_date }}" --export-dir "$EXPORT_PATH"
          else
            python -m app.main --trigger "$TRIGGER" --export-dir "$EXPORT_PATH"
          fi

      - name: Commit & push sanitized data snapshot to data branch
        working-directory: public_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json sources.json reports.json reconciled.json drafts.json runs.json manifest.json cinepulse.db
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily box-office snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push -u origin data
          fi
